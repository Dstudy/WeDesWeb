<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Dự Án</title>
  <link rel="stylesheet" href="./style-project.css">
  <style>
    .rotate-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0b0f;color:#fff;z-index:100002;text-align:center;padding:2rem}
    .rotate-card{max-width:28rem;width:90vw;border-radius:16px;padding:2rem;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .rotate-icon{font-size:3rem;margin-bottom:.75rem}
    .rotate-title{font-size:clamp(1.25rem,4vw,1.75rem);font-weight:700}
    .rotate-sub{opacity:.9;margin-top:.5rem;font-size:clamp(.95rem,3.2vw,1.05rem)}
    @media(orientation:portrait)and(max-width:1024px){.rotate-overlay{display:flex}}
  </style>
</head>
<body>
  <div class="rotate-overlay">
    <div class="rotate-card">
      <div class="rotate-icon">🔄</div>
      <div class="rotate-title">Please rotate your device</div>
      <div class="rotate-sub">This experience is best viewed in landscape.</div>
    </div>
  </div>
<!-- partial:index.partial.html -->
<div class="nav-bar">
    <overlay-menu></overlay-menu>
    <div class="nav-wrapper">
		<a href="showcase.html"><img class="next-btn" src="/img/Arrow.svg" alt=""></a>   
        <h2>Showcase</h2>
    </div>
</div>

			<img data-speed="1" src="/img/TT5.JPG" alt="">
			<img data-speed="1.1" src="/img/TT7.JPG" alt="">

			<img data-speed="0.8" src="/img/TT12.JPG" alt="">

</div>
<!-- partial -->
<script type="module" src="/src/components/overlay-menu.js"></script>

<div class="scroll-hint" id="scroll-hint" aria-hidden="true">
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
  <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-top:-14px;opacity:.35"><polyline points="6 9 12 15 18 9"/></svg>
</div>
<script>
(function(){
  var h=document.getElementById('scroll-hint');
  if(!h)return;
  window.addEventListener('scroll',function(){
    h.classList.toggle('is-hidden',window.scrollY>80);
  },{passive:true});
})();
</script>

</body>
</html>
