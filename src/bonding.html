<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>[gsap] ❍ Infinite Draggable Image Gallery</title>
  <link rel="stylesheet" href="https://public.codepenassets.com/css/normalize-5.0.0.min.css">
<link rel="stylesheet" href="./style-bond.css">
    <style>
      .rotate-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0b0b0f;color:#fff;z-index:100002;text-align:center;padding:2rem}
      .rotate-card{max-width:28rem;width:90vw;border-radius:16px;padding:2rem;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.35)}
      .rotate-icon{font-size:3rem;margin-bottom:.75rem}
      .rotate-title{font-size:clamp(1.25rem,4vw,1.75rem);font-weight:700}
      .rotate-sub{opacity:.9;margin-top:.5rem;font-size:clamp(.95rem,3.2vw,1.05rem)}
      @media(orientation:portrait)and(max-width:1024px){.rotate-overlay{display:flex}}
    </style>
</head>
<body>
  <div class="rotate-overlay">
    <div class="rotate-card">
      <div class="rotate-icon">🔄</div>
      <div class="rotate-title">Please rotate your device</div>
      <div class="rotate-sub">This experience is best viewed in landscape.</div>
    </div>
  </div>
<!-- partial:index.partial.html -->

</div>

<div class="project-title">
  <p></p>
</div>

<!-- Page vignette effects -->
<div class="page-vignette-container">
  <div class="page-vignette"></div>
  <div class="page-vignette-strong"></div>
  <div class="page-vignette-extreme"></div>
</div>
<!-- Drag hint indicator -->
<div class="drag-hint" id="dragHint">
  <div class="drag-hint-icon">
    <div class="drag-hint-ring"></div>
    <div class="drag-hint-arrows">
      <div class="drag-arrow arrow-up"></div>
      <div class="drag-arrow arrow-right"></div>
      <div class="drag-arrow arrow-down"></div>
      <div class="drag-arrow arrow-left"></div>
    </div>
    <div class="drag-hint-dot"></div>
  </div>
  <span class="drag-hint-label">drag to explore</span>
</div>
